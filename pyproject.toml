[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codess"
description = "Local session record store for Claude Code, Codex, and Cursor"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
  "zstandard>=0.23",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
]

[project.scripts]
codess = "codess.project:console_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["codess*", "cli*"]

[tool.setuptools.dynamic]
version = {attr = "codess.__version__"}

[tool.ruff.lint.per-file-ignores]
# S608 rationale and per-site pattern: CoPlan.md 10.4.
"src/codess/baseline_validation.py" = ["S608"]
"src/codess/configuration_audit.py" = ["S608"]
"src/codess/cursor_feature_audit.py" = ["S608"]
"src/codess/cursor_source.py" = ["S608"]
"src/codess/orientation_audit.py" = ["S608"]
"src/codess/project_annotations.py" = ["S608"]
"src/codess/query_api.py" = ["S608"]
"src/codess/session_names.py" = ["S608"]
"src/codess/snapshot.py" = ["S608"]
"src/codess/storage_report.py" = ["S608"]
"src/codess/store.py" = ["S608"]
"src/cli/query_cmd.py" = ["S608"]
